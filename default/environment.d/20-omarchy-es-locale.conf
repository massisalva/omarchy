# Sets the message-catalog locale so third-party .desktop Name[es]/GenericName[es]
# entries resolve in Omarchy Shell's launcher, not just Omarchy's own strings.
#
# LANGUAGE alone covers Omarchy's own translation loader (shell/Commons/I18nModel.js,
# default/bash/i18n), which follows the LANGUAGE/LC_ALL/LC_MESSAGES/LANG precedence
# documented in docs/i18n.md. Quickshell's DesktopEntries (Qt) does not consult
# LANGUAGE for locale matching, only LC_MESSAGES/LANG, so third-party app names stay
# untranslated unless LC_MESSAGES is set explicitly.
#
# LC_MESSAGES, not LANG: uwsm's environment preloader always re-imports LANG from
# the login session (ultimately /etc/locale.conf), overriding anything set here for
# that one variable. LC_MESSAGES isn't part of that login-session import, so it
# survives. This only affects message/desktop-entry locale, not date/number/collation
# formatting. Override per-user in ~/.config/environment.d/ with your own regional
# variant (e.g. LC_MESSAGES=es_AR.UTF-8) if it's generated on your system.
LANGUAGE=es
LC_MESSAGES=es_ES.UTF-8
